version: 1
name: coding/l1-duration
fixture: ../../fixtures/l1-duration
git: {init: true}
timeout: 8m
task: |
  Repair ParseSeconds: accept nonnegative integer seconds, reject negative or malformed input, and return the corresponding time.Duration.
  Preserve existing tests and go.mod. Use only the Go standard library. Complete and validate the task in this workspace.
verify:
  - run:
      argv: ["git", "diff", "--exit-code", "HEAD", "--", "*_test.go", "go.mod"]
      expect: {exit: 0}
  - run:
      argv: ["go", "test", "-count=1", "./..."]
      expect: {exit: 0}
  - run:
      argv: ["go", "vet", "./..."]
      expect: {exit: 0}
